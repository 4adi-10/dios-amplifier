<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIOS helper</title>
<link rel="icon" type="image/png" href="/icons/favicon-64.png">
<style>
:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; background: #0d060b; color: #fff; font: 13px/1.4 "Epilogue", system-ui, sans-serif; overflow: hidden; }
#p { position: fixed; left: 0; top: 0; width: 100%; height: calc(100% - 52px); border: 0; display: block; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; height: 52px; display: grid; align-content: center; gap: 2px; padding: 0 14px;
  border-top: 1px solid rgb(255 255 255 / .1); color: #a89ca4; }
.bar b { color: #ff488b; font-weight: 500; }
.bar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#go { position: fixed; left: 0; top: 0; right: 0; bottom: 52px; display: none; place-items: center; z-index: 2; border: 0; cursor: pointer;
  background: rgb(13 6 11 / .82); color: #fff; font: 500 16px/1.3 inherit; font-family: inherit; }
#go[data-on] { display: grid; }
#go i { display: block; font-style: normal; color: #ff488b; font-size: 34px; margin-bottom: 6px; }
</style>
</head>
<body>
<div id="p"></div>
<button id="go" type="button"><span><i>▶</i>Click once to start the sound</span></button>
<div class="bar"><span><b>DIOS helper</b> · carries the video's sound to Discord</span><span id="t">Keep this open. You can minimize it.</span></div>
<script>
/* DIOS helper: plays the same YouTube video as the DIOS site, in sync, so its sound can be shared to Discord.
   The site's player is the boss: it sends { v, t, playing } over a BroadcastChannel and this window follows. */
(() => {
  const q = new URLSearchParams(location.search);
  const clean = x => String(x || '').replace(/[^\w-]/g, '').slice(0, 11);
  const chan = 'BroadcastChannel' in window ? new BroadcastChannel('dios-yt') : null;
  const send = o => chan && chan.postMessage(Object.assign({ from: 'yt' }, o));
  const go = document.getElementById('go'), tEl = document.getElementById('t');
  let player = null, want = null, curV = clean(q.get('v')), stuckSince = 0, stuck = false;

  function setStuck(on) {
    if (on === stuck) return;
    stuck = on; go.toggleAttribute('data-on', on); send({ stuck: on });
  }
  function follow() {
    if (!player || !player.getPlayerState || !want) return;
    const st = player.getPlayerState();
    if (want.v && want.v !== curV) {
      curV = want.v;
      want.playing ? player.loadVideoById({ videoId: curV, startSeconds: want.t }) : player.cueVideoById({ videoId: curV, startSeconds: want.t });
      return;
    }
    const target = want.t + (want.playing ? (Date.now() - want.at) / 1000 : 0);
    const now = player.getCurrentTime() || 0;
    if (Math.abs(now - target) > (want.playing ? 0.45 : 0.25) && st !== 3) player.seekTo(target, true);
    if (want.playing && st !== 1 && st !== 3) player.playVideo();
    if (!want.playing && (st === 1 || st === 3)) player.pauseVideo();
    // the browser may hold back sound until this window is clicked once
    if (want.playing && st !== 1 && st !== 3) { stuckSince = stuckSince || Date.now(); if (Date.now() - stuckSince > 2500) setStuck(true); }
    else { stuckSince = 0; setStuck(false); }
  }
  go.addEventListener('click', () => { if (player && player.playVideo) { player.unMute(); player.playVideo(); } setTimeout(follow, 300); });

  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('p', {
      videoId: curV || undefined,
      playerVars: { autoplay: 0, playsinline: 1, rel: 0, controls: 0, disablekb: 1, origin: location.origin },
      events: {
        onReady: () => { player.unMute(); player.setVolume(100); send({ ready: true }); follow(); },
        onStateChange: () => {
          const d = (player.getVideoData && player.getVideoData()) || {};
          if (d.title) { document.title = d.title + ' · DIOS helper'; tEl.textContent = d.title; }
          follow();
        },
        onError: e => send({ error: e.data })
      }
    });
  };
  if (chan) chan.onmessage = e => {
    const m = e.data || {};
    if (m.from === 'yt') return;
    if (m.cmd === 'sync') { want = { v: clean(m.v), t: +m.t || 0, playing: !!m.playing, at: +m.at || Date.now() }; follow(); }
  };
  // heartbeat: the site mutes its own player only while this window is alive, so you never hear the video twice
  setInterval(() => send({ alive: true }), 800);
  send({ alive: true });
  addEventListener('pagehide', () => send({ closed: true }));

  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
})();
</script>
</body>
</html>
