<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;width:340px;padding:14px;font:14px/1.45 "Segoe UI",system-ui,sans-serif;color:#fff;
 background:radial-gradient(70% 50% at 15% 10%,#ff488b88,transparent 70%),radial-gradient(60% 50% at 95% 95%,#4078ff66,transparent 70%),radial-gradient(50% 40% at 90% 15%,#ff8c5a44,transparent 70%),#0b0509}
.glass{position:relative;padding:18px;border-radius:22px;background:linear-gradient(135deg,#ffffff24,#ffffff0a 45%,#ffffff12);
 -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid #ffffff38;
 box-shadow:inset 0 1px 0 #ffffff73,inset 0 -1px 0 #ffffff14,0 20px 50px -20px #000a}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
 background:linear-gradient(115deg,#ffffff8c,#ffa0c840 18%,transparent 35%,transparent 65%,#8cb4ff4d 85%,#ffffff59);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.head b{font-weight:600;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;background:linear-gradient(180deg,#ffffff1f,#ffffff08);border:1px solid #ffffff29;box-shadow:inset 0 1px 0 #ffffff38;font-size:12.5px;color:#f1e6ec}
.chip i{width:7px;height:7px;border-radius:50%;background:#a89ca4}
.chip.on i{background:#4ee0a0;box-shadow:0 0 8px #4ee0a0}
#read{font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;
 background:linear-gradient(180deg,#fff,#ffc2d9 35%,#ff488b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px #ff488b73)}
#db{color:#d0c2ca;margin:2px 0 6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:4px 0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,#ff488b var(--fill,0%),#ffffff1f var(--fill,0%));box-shadow:inset 0 1px 3px #0008}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe6ef 40%,#ffb3cf);box-shadow:0 0 0 4px #ffffff1f,0 3px 10px #ff488b8c}
.row{display:flex;gap:6px;margin:6px 0 12px}
button,select{font:inherit;color:#fff;background:linear-gradient(180deg,#ffffff1f,#ffffff08);border:1px solid #ffffff2e;border-radius:99px;padding:7px 4px;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff38;transition:border-color .14s,transform .14s,background .14s}
button:hover,select:hover{border-color:#ffffff66;background:linear-gradient(180deg,#ffffff2e,#ffffff0f);transform:translateY(-1px)}
button:active{transform:scale(.985)}
.row button{flex:1;font-size:12.5px}
.eq{display:grid;gap:0;padding:10px 12px;border-radius:16px;background:#00000026;border:1px solid #ffffff1f;box-shadow:inset 0 1px 0 #ffffff14;margin-bottom:10px}
.eq label{display:flex;justify-content:space-between;font-size:12.5px;color:#d0c2ca}
.eq output{font-family:ui-monospace,Consolas,monospace;color:#fff}
select{width:100%;border-radius:14px;padding:9px 10px;margin-bottom:6px}
select option{background:#1b0e17}
.sw{display:flex;justify-content:space-between;align-items:center;min-height:38px;color:#f1e6ec;cursor:pointer}
.sw input{appearance:none;width:46px;height:28px;border-radius:99px;background:#ffffff1f;box-shadow:inset 0 1px 3px #0008,inset 0 0 0 1px #ffffff1f;position:relative;cursor:pointer;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e9dde3);box-shadow:0 2px 6px #0007;transition:transform .2s}
.sw input:checked{background:linear-gradient(180deg,#ff7aab,#ff2f7a);box-shadow:inset 0 1px 0 #ffffff73,0 0 14px #ff488b8c}
.sw input:checked::after{transform:translateX(18px)}
.note{color:#d0c2ca;font-size:12.5px;margin-top:8px}
</style></head><body>
<div class="glass">
<div class="head"><b>DIOS Amplifier</b><span class="chip" id="chip"><i></i><span id="chipText">On</span></span></div>
<div id="read">1x</div><div id="db">+0 dB</div>
<input type="range" id="gain" min="0" max="100" step="0.1" value="0" aria-label="Gain">
<div class="row">
  <button data-x="10">10x</button><button data-x="100">100x</button><button data-x="1000">1k</button>
  <button data-x="10000">10k</button><button data-x="100000">100k</button>
</div>
<div class="eq">
  <label for="bass">Bass <output id="bassV">0 dB</output></label><input type="range" id="bass" min="-12" max="15" step="1" value="0">
  <label for="mid">Presence <output id="midV">0 dB</output></label><input type="range" id="mid" min="-12" max="12" step="1" value="0">
  <label for="treble">Treble <output id="trebleV">0 dB</output></label><input type="range" id="treble" min="-12" max="12" step="1" value="0">
</div>
<select id="mode" aria-label="Limiter">
  <option value="clear">Loud and clear (no distortion)</option><option value="comp">Radio compressor</option><option value="soft">Soft clip (warm drive)</option><option value="hard">Hard clip (harsh static)</option>
</select>
<label class="sw" for="on">Boost on <input type="checkbox" id="on" checked></label>
<div class="note">After installing, reload Discord and rejoin voice. Turn off Discord's automatic gain control.</div>
</div>
<script src="popup.js"></script>
</body></html>
