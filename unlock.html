<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Aadi, DIOS Studioz">
<meta name="copyright" content="&copy; 2026 DIOS Studioz. Fully made by Aadi.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a0408">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DIOS Amp">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/favicon-64.png">
<meta name="robots" content="noindex">
<title>DIOS Amplifier: enter your access key</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400..600&family=Instrument+Serif&family=JetBrains+Mono:wght@400..500&display=swap" rel="stylesheet">
<style>
/* key screen, atelier theme: noir plum, bone type, one rouge accent. CSS only, same form and script as before. */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100svh;display:grid;place-items:center;padding:24px;color:#f4eeea;font:400 16px/1.5 "Epilogue",system-ui,sans-serif;background:#0a0408;overflow-x:hidden;isolation:isolate}
body::before{content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;filter:blur(30px);
 background:radial-gradient(36vmax 30vmax at 76% 18%,rgb(255 72 139/.26),transparent 62%),radial-gradient(40vmax 34vmax at 14% 92%,rgb(194 24 91/.22),transparent 64%);
 animation:drift 22s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 50%,rgb(0 0 0/.6))}
@keyframes drift{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(-4vmax,3vmax,0) rotate(-8deg) scale(1.06)}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes mask{from{transform:translateY(110%)}}
@keyframes draw{from{transform:scaleX(0)}}
.card{position:relative;width:min(100%,460px);padding:40px 36px 34px;border-radius:20px;background:rgb(20 10 16/.72);
 -webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);border:1px solid rgb(244 238 234/.2);box-shadow:0 80px 160px -70px #000;
 animation:rise 1.2s cubic-bezier(.16,1,.3,1) both}
.card::after{content:"";position:absolute;left:36px;right:36px;top:92px;height:1px;background:rgb(244 238 234/.2);transform-origin:0 50%;animation:draw 1.4s cubic-bezier(.76,0,.24,1) .3s both}
.brand{display:flex;align-items:center;gap:10px;font:400 24px/1 "Instrument Serif","Cormorant Garamond",Georgia,serif;margin-bottom:56px}
.mark{width:22px;height:18px;display:grid;gap:3px}.mark i{display:block;height:4px;border-radius:2px;background:#ff488b;transform-origin:0 50%;animation:draw .9s cubic-bezier(.16,1,.3,1) both}.mark i:nth-child(2){width:75%;animation-delay:.12s}.mark i:nth-child(3){width:50%;animation-delay:.24s}
h1{margin:0 0 12px;font:400 clamp(40px,9vw,54px)/1 "Instrument Serif","Cormorant Garamond",Georgia,serif;letter-spacing:-.02em;overflow:hidden;padding-bottom:.12em}
h1{animation:rise 1.1s cubic-bezier(.16,1,.3,1) .25s both}
p{margin:0;color:#c9bec3;animation:rise 1.1s cubic-bezier(.16,1,.3,1) .35s both}
form{animation:rise 1.1s cubic-bezier(.16,1,.3,1) .45s both}
label{display:block;margin:30px 0 8px;font:400 12px/1.2 "JetBrains Mono",ui-monospace,monospace;color:#9c8f96}
input{width:100%;height:54px;padding:0 16px;border-radius:10px;font:500 16px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.04em;color:#f4eeea;text-transform:uppercase;
 background:transparent;border:1px solid rgb(244 238 234/.2);outline:none;transition:border-color .3s,box-shadow .4s}
input::placeholder{color:rgb(244 238 234/.3)}
input:hover{border-color:rgb(244 238 234/.45)}
input:focus{border-color:#ff488b;box-shadow:0 0 0 5px rgb(255 72 139/.14)}
button{width:100%;height:54px;margin-top:16px;border:0;border-radius:999px;cursor:pointer;font:500 16px/1 "Epilogue",system-ui,sans-serif;color:#0a0408;position:relative;overflow:hidden;isolation:isolate;
 background:#f4eeea;transition:transform .5s cubic-bezier(.16,1,.3,1)}
button::before{content:"";position:absolute;inset:-1px;z-index:-1;border-radius:inherit;background:#ff488b;transform:translateY(102%);transition:transform .6s cubic-bezier(.16,1,.3,1)}
button:hover::before,button:focus-visible::before{transform:none}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible{outline:2px solid #ff488b;outline-offset:3px}
button[disabled]{opacity:.6;cursor:default}
.err{min-height:1.5em;margin-top:14px;color:#ff8fb5;font-size:14px}
.small{margin-top:18px;font-size:14px;color:#9c8f96}
.dios-copy{position:fixed;left:0;right:0;bottom:16px;margin:0;text-align:center;font:400 12px/1 "JetBrains Mono",ui-monospace,monospace;color:rgb(244 238 234/.4)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main class="card">
  <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>DIOS Amplifier</div>
  <h1>Enter your access key</h1>
  <p>DIOS Amplifier is invite only. Keys are made by admins.</p>
  <form id="f" novalidate>
    <label for="key">Access key</label>
    <input id="key" name="key" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="DIOS-XXXXXX-XXXXXX-…" required>
    <button id="go" type="submit">Unlock the amplifier</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <p class="small">No key? Ask the person who shared this site with you.</p>
</main>
<p class="dios-copy">&copy; 2026 DIOS Studioz. Fully made by Aadi.</p>
<script>
const f = document.getElementById('f'), go = document.getElementById('go'), err = document.getElementById('err'), key = document.getElementById('key');
const nextPath = (() => { const n = new URLSearchParams(location.search).get('next') || '/'; return /^\/[^/\\]/.test(n) || n === '/' ? n : '/'; })();
f.addEventListener('submit', async e => {
  e.preventDefault();
  err.textContent = '';
  if (!key.value.trim()) { err.textContent = 'Paste your key first.'; key.focus(); return; }
  go.disabled = true; go.textContent = 'Checking…';
  try {
    const r = await fetch('/api/unlock', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: key.value }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) { go.textContent = 'Unlocked'; location.replace(nextPath); return; }
    err.textContent = j.error || 'That key did not work.';
  } catch (e2) { err.textContent = 'Could not reach the server. Check your connection.'; }
  go.disabled = false; go.textContent = 'Unlock the amplifier';
});
key.focus();
</script>
<script src="/pwa.js"></script>
</body>
</html>
